<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مواقيت الصلاة</title>
<meta name="description" content="مواقيت الصلاة لأي مدينة مع عدّاد للصلاة القادمة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --text: #1f2a28;
    --muted: #6b7471;
    --accent: #0f6b5c;
    --accent-soft: #e3f1ee;
    --border: #e4e0d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161a;
      --card: #182127;
      --text: #e8eeec;
      --muted: #94a3a0;
      --accent: #4fc2a9;
      --accent-soft: #1d3a36;
      --border: #26323a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Tajawal", system-ui, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 520px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  select, input, button {
    font: inherit;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    min-width: 0;
  }
  select, input { flex: 1; }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 700; }
  #custom { display: none; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .next { text-align: center; margin-bottom: 16px; }
  .next .label { color: var(--muted); }
  .next .name { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
  .countdown {
    font-size: 2.6rem; font-weight: 700; letter-spacing: 2px;
    font-variant-numeric: tabular-nums; direction: ltr;
  }
  .date { color: var(--muted); text-align: center; font-size: .95rem; margin-top: 4px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 14px; border-radius: 10px;
  }
  li + li { border-top: 1px solid var(--border); }
  li.active { background: var(--accent-soft); border-color: transparent; font-weight: 700; }
  li.active + li { border-color: transparent; }
  li .t { font-variant-numeric: tabular-nums; direction: ltr; }
  .status { color: var(--muted); text-align: center; padding: 24px 0; }
  .error { color: #c0392b; }
  footer { margin-top: 24px; color: var(--muted); font-size: .85rem; text-align: center; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>مواقيت الصلاة</h1>
  <p class="sub">اختر مدينتك لعرض مواقيت اليوم والوقت المتبقي للصلاة القادمة.</p>

  <form id="form">
    <select id="city" aria-label="المدينة"></select>
    <input id="custom" placeholder="اكتب اسم المدينة، مثل: London" aria-label="مدينة أخرى">
    <button type="submit">عرض</button>
  </form>

  <div id="result" class="card"><p class="status">جارٍ التحميل…</p></div>

  <footer>
    البيانات من <a href="https://aladhan.com/prayer-times-api" target="_blank" rel="noopener">aladhan.com</a>
  </footer>
</main>

<script>
const PRAYERS = [
  ["Fajr", "الفجر"], ["Sunrise", "الشروق"], ["Dhuhr", "الظهر"],
  ["Asr", "العصر"], ["Maghrib", "المغرب"], ["Isha", "العشاء"],
];
const CITIES = [
  ["صنعاء", "Sanaa", "Yemen"], ["عدن", "Aden", "Yemen"], ["تعز", "Taiz", "Yemen"],
  ["الحديدة", "Al Hudaydah", "Yemen"], ["إب", "Ibb", "Yemen"], ["المكلا", "Mukalla", "Yemen"],
  ["مكة المكرمة", "Makkah", "Saudi Arabia"], ["المدينة المنورة", "Madinah", "Saudi Arabia"],
  ["الرياض", "Riyadh", "Saudi Arabia"], ["جدة", "Jeddah", "Saudi Arabia"],
  ["القاهرة", "Cairo", "Egypt"], ["الإسكندرية", "Alexandria", "Egypt"],
  ["دبي", "Dubai", "United Arab Emirates"], ["أبوظبي", "Abu Dhabi", "United Arab Emirates"],
  ["الدوحة", "Doha", "Qatar"], ["الكويت", "Kuwait City", "Kuwait"], ["المنامة", "Manama", "Bahrain"],
  ["مسقط", "Muscat", "Oman"], ["عمّان", "Amman", "Jordan"], ["القدس", "Jerusalem", "Palestine"],
  ["غزة", "Gaza", "Palestine"], ["دمشق", "Damascus", "Syria"], ["بيروت", "Beirut", "Lebanon"],
  ["بغداد", "Baghdad", "Iraq"], ["الخرطوم", "Khartoum", "Sudan"], ["طرابلس", "Tripoli", "Libya"],
  ["تونس", "Tunis", "Tunisia"], ["الجزائر", "Algiers", "Algeria"], ["الرباط", "Rabat", "Morocco"],
  ["الدار البيضاء", "Casablanca", "Morocco"], ["إسطنبول", "Istanbul", "Turkey"],
];

const $ = (id) => document.getElementById(id);
const select = $("city"), custom = $("custom"), result = $("result");
let timer = null;

CITIES.forEach(([ar], i) => select.add(new Option(ar, i)));
select.add(new Option("مدينة أخرى…", "other"));

function store(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

select.addEventListener("change", () => {
  const other = select.value === "other";
  custom.style.display = other ? "block" : "none";
  if (other) custom.focus(); else show();
});
$("form").addEventListener("submit", (e) => { e.preventDefault(); show(); });

// Seconds since local midnight in the given IANA time zone.
function nowSeconds(tz) {
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: tz, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23",
  }).formatToParts(new Date());
  const get = (t) => +parts.find((p) => p.type === t).value;
  return get("hour") * 3600 + get("minute") * 60 + get("second");
}

const toSec = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 3600 + m * 60; };
const pad = (n) => String(n).padStart(2, "0");

function nextPrayer(timings, tz) {
  const now = nowSeconds(tz);
  for (const [key, ar] of PRAYERS) {
    if (key === "Sunrise") continue;
    const at = toSec(timings[key]);
    if (at > now) return { key, ar, left: at - now };
  }
  return { key: "Fajr", ar: "الفجر", left: toSec(timings.Fajr) + 86400 - now };
}

function render(name, data) {
  const timings = {};
  PRAYERS.forEach(([k]) => { timings[k] = data.timings[k].split(" ")[0]; });
  const tz = data.meta.timezone;
  const h = data.date.hijri;
  const dateHtml = `<bdi dir="ltr">${escapeHtml(data.date.gregorian.date)}</bdi> | ` +
    escapeHtml(`${h.day} ${h.month.ar} ${h.year} هـ`);

  result.innerHTML = `
    <div class="next">
      <div class="label">الصلاة القادمة في ${escapeHtml(name)}</div>
      <div class="name" id="nextName"></div>
      <div class="countdown" id="countdown"></div>
      <div class="date">${dateHtml}</div>
    </div>
    <ul>${PRAYERS.map(([k, ar]) =>
      `<li data-key="${k}"><span>${ar}</span><span class="t">${timings[k]}</span></li>`).join("")}
    </ul>`;

  let refetched = false;
  const tick = () => {
    const n = nextPrayer(timings, tz);
    $("nextName").textContent = n.ar;
    const s = n.left;
    $("countdown").textContent = `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`;
    result.querySelectorAll("li").forEach((li) => li.classList.toggle("active", li.dataset.key === n.key));
    // After midnight in the city, reload to get the new day's times.
    if (!refetched && nowSeconds(tz) < 60) { refetched = true; setTimeout(show, 60000); }
  };
  tick();
  timer = setInterval(tick, 1000);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function show() {
  clearInterval(timer);
  let url, name;
  if (select.value === "other") {
    name = custom.value.trim();
    if (!name) { custom.focus(); return; }
    url = `https://api.aladhan.com/v1/timingsByAddress?address=${encodeURIComponent(name)}`;
    store("custom", name);
  } else {
    const [ar, city, country] = CITIES[select.value];
    name = ar;
    url = `https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=${encodeURIComponent(country)}`;
  }
  store("city", select.value);
  result.innerHTML = '<p class="status">جارٍ التحميل…</p>';
  try {
    const res = await fetch(url);
    const json = await res.json();
    if (json.code !== 200) throw new Error("لم يتم العثور على المدينة");
    render(name, json.data);
  } catch (err) {
    result.innerHTML = `<p class="status error">تعذّر جلب المواقيت: ${escapeHtml(err.message)}</p>`;
  }
}

const saved = load("city");
if (saved !== null && (saved === "other" || CITIES[saved])) select.value = saved;
if (select.value === "other") { custom.style.display = "block"; custom.value = load("custom") || ""; }
show();
</script>
</body>
</html>
